<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placement Portal</title>

  <!-- Bootstrap (styling only, no other CSS framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Vue 3 (CDN, no build step) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Runtime .vue single-file-component loader, so components can live as
       real .vue files under frontend/src/components without a build step -->
  <script src="https://unpkg.com/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    const { loadModule } = window["vue3-sfc-loader"];
    const options = {
      moduleCache: { vue: Vue },
      async getFile(url) {
        const res = await fetch(url);
        if (!res.ok) throw Object.assign(new Error(url + " " + res.statusText), { res });
        return await res.text();
      },
      addStyle(textContent) {
        const style = Object.assign(document.createElement("style"), { textContent });
        document.head.appendChild(style);
      },
    };

    const App = Vue.defineAsyncComponent(() =>
      loadModule("/src/components/App.vue", options)
    );

    Vue.createApp(App).mount("#app");
  </script>

  <!-- Bootstrap JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
